name: iOS screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot simulator (6.7")
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              for x in devs:
                  if x['name'] in ('iPhone 16 Plus','iPhone 15 Plus','iPhone 15 Pro Max','iPhone 14 Pro Max'):
                      print(x['udid']); raise SystemExit
          ")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Capture
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screens_test.dart -d "$UDID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mobile/screenshots/*.png
